<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヒット曲イントロクイズ</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--text:#1d1b18;--sub:#6b665e;--accent:#e8454f;--stop:#2b2b2b;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--card:#25232a;--text:#f3f0ea;--sub:#a29d94;--accent:#ff5b66;--stop:#555}}
:root[data-theme="dark"]{--bg:#17161a;--card:#25232a;--text:#f3f0ea;--sub:#a29d94;--accent:#ff5b66;--stop:#555}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:460px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;margin:4px 0;text-align:center}
.card{background:var(--card);border-radius:20px;padding:24px 18px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
.q{font-size:64px;line-height:1}
.hint{color:var(--sub);font-size:14px;margin-top:10px}
.year{font-size:44px;font-weight:800;color:var(--accent)}
.date{font-size:16px;color:var(--sub);margin-bottom:10px}
.title{font-size:24px;font-weight:700;line-height:1.3}
.artist{font-size:17px;color:var(--sub);margin-top:6px}
button{font:inherit;font-size:20px;font-weight:700;border:0;border-radius:16px;padding:18px;color:#fff;background:var(--accent);width:100%}
button.stop{background:var(--stop)}
button:disabled{opacity:.4}
.bars{display:flex;gap:5px;height:44px;align-items:flex-end;margin-top:14px}
.bars i{width:7px;background:var(--accent);border-radius:3px;animation:b .8s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}.bars i:nth-child(5){animation-delay:.6s}
@keyframes b{0%,100%{height:8px}50%{height:42px}}
#ytwrap{position:relative;height:0}
#yt{position:absolute;left:0;top:0;width:200px;height:113px;border:0;opacity:0;pointer-events:none}
#msg{color:var(--accent);font-size:14px;text-align:center;min-height:18px}
.count{text-align:center;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>🎵 ヒット曲イントロクイズ</h1>
  <div class="card" id="card"></div>
  <div id="ytwrap"></div>
  <div id="msg"></div>
  <button id="play">▶ 再生</button>
  <button id="stop" class="stop" disabled>■ 停止して答えを見る</button>
  <div class="count" id="count"></div>
</main>
<script>
// ★ 曲リスト：ここに追加していく（id = YouTubeの動画ID）
var SONGS=[
 {id:"x8VYWazR5mE",title:"夜に駆ける",artist:"YOASOBI",date:"2019-12-15"},
 {id:"SX_ViT4Ra7k",title:"Lemon",artist:"米津玄師",date:"2018-03-14"},
 {id:"TQ8WlA2GXbk",title:"Pretender",artist:"Official髭男dism",date:"2019-05-15"},
 {id:"0xSiBpUdW4E",title:"マリーゴールド",artist:"あいみょん",date:"2018-08-08"},
 {id:"Qp3b-RXtz4w",title:"うっせぇわ",artist:"Ado",date:"2020-10-23"}
];
var card=document.getElementById("card"),playBtn=document.getElementById("play"),stopBtn=document.getElementById("stop"),countEl=document.getElementById("count");
var bag=[],cur=null,frame=null,played=0,state="idle",errs=0;

function fmt(d){var p=d.split("-");return p[0]+"年"+(+p[1])+"月"+(+p[2])+"日";}
function next(){if(!bag.length){bag=SONGS.slice().sort(function(){return Math.random()-.5});}return bag.pop();}
function showIdle(msg){card.innerHTML='<div class="q">🎧</div><div class="hint">'+msg+'</div>';}
function showPlaying(){card.innerHTML='<div class="q">❓</div><div class="bars"><i></i><i></i><i></i><i></i><i></i></div><div class="hint">この曲、なんの曲？発売年は？</div>';}
function showAnswer(s){card.innerHTML='<div class="year">'+s.date.slice(0,4)+'年</div><div class="date">'+fmt(s.date)+' 発売</div><div class="title">'+s.title+'</div><div class="artist">'+s.artist+'</div>';}

function mountFrame(song){
  if(frame){frame.remove();frame=null;}
  var start=15+Math.floor(Math.random()*95); // ランダムな再生開始位置（15〜110秒）
  frame=document.createElement("iframe");
  frame.id="yt";
  frame.allow="autoplay; encrypted-media";
  frame.setAttribute("playsinline","");
  frame.src="https://www.youtube.com/embed/"+song.id+"?autoplay=1&playsinline=1&controls=0&rel=0&enablejsapi=1&start="+start+"&origin="+encodeURIComponent(location.origin);
  frame.onload=function(){try{frame.contentWindow.postMessage(JSON.stringify({event:"listening",id:1,channel:"widget"}),"*");}catch(e){}};
  document.getElementById("ytwrap").appendChild(frame);
}
function cmd(fn){try{if(frame)frame.contentWindow.postMessage(JSON.stringify({event:"command",func:fn,args:""}),"*");}catch(e){}}

playBtn.onclick=function(){
  cur=next();state="playing";played++;document.getElementById("msg").textContent="";
  showPlaying();mountFrame(cur);
  playBtn.disabled=true;stopBtn.disabled=false;
  countEl.textContent=played+"曲目";
};
stopBtn.onclick=function(){
  if(state!=="playing")return;
  cmd("pauseVideo");
  if(frame){frame.remove();frame=null;}
  state="answer";showAnswer(cur);
  playBtn.disabled=false;playBtn.textContent="▶ 次の曲";stopBtn.disabled=true;
};
// 再生できない動画（埋め込み禁止・削除など）は自動で次の曲へ
window.addEventListener("message",function(e){
  if(!/youtube(-nocookie)?\.com$/.test(new URL(e.origin).hostname.replace(/^www\./,"")))return;
  var d;try{d=typeof e.data==="string"?JSON.parse(e.data):e.data;}catch(x){return;}
  if(d&&d.event==="onError"&&state==="playing"){
    errs++;document.getElementById("msg").textContent="再生エラー("+(d.info||"?")+"): "+cur.title;
    if(errs<3){played--;playBtn.disabled=false;playBtn.click();}
  }
  if(d&&d.event==="onStateChange"&&d.info===0&&state==="playing"){cmd("seekTo");}
});
showIdle("「再生」を押すと、ヒット曲がランダムな場所から流れます");
</script>
</body>
</html>
